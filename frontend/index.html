<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Splitter 3 Min</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <div class="eyebrow">LOCAL VIDEO TOOL</div>
    <h1>Split your video.</h1>
    <p class="subtitle">Upload a video, choose the part length and output format, then save all generated clips locally.</p>

    <section class="workflow-section generation-section">
      <div class="workflow-head">
        <div>
          <div class="section-kicker">VIDEO SPLITTER</div>
          <h2>Create video parts</h2>
          <p>No social accounts, uploads or external platform connections.</p>
        </div>
        <span class="workflow-badge">SPLIT</span>
      </div>

      <form id="split-form">
        <label class="dropzone" for="video-file">
          <input id="video-file" name="file" type="file" accept="video/*,.mkv,.avi,.webm,.m4v,.ts" required />
          <span class="upload-icon">↑</span>
          <span class="drop-title">Choose your source video</span>
          <span id="file-name" class="muted">MP4, MOV, MKV, AVI, WEBM and more</span>
        </label>

        <div class="row settings-row">
          <label>Part length (seconds)
            <input id="chunk-seconds" type="number" value="180" min="1" max="3600" />
          </label>
          <label>Output format
            <select id="orientation">
              <option value="vertical" selected>Vertical — 1080 × 1920 (9:16) — Crop to fill</option>
              <option value="horizontal">Horizontal — 1920 × 1080 (16:9)</option>
              <option value="vertical_full_frame">Vertical Full Frame — 1080 × 1920 (9:16) — No crop</option>
            </select>
          </label>
        </div>

        <button id="split-btn" class="primary-btn" type="submit">Split Video</button>
      </form>
    </section>

    <section id="progress-section" class="workflow-section" hidden>
      <div class="workflow-head">
        <div>
          <div class="section-kicker">PROCESSING</div>
          <h2>Creating your clips</h2>
          <p id="progress-label">Preparing…</p>
        </div>
        <span id="progress-value" class="workflow-badge">0%</span>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </section>

    <div id="status" class="status" hidden></div>
    <div id="result" class="result" hidden></div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
